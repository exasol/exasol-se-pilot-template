# Examples below use GCME - German Companies Make Everything, a fictional
# stand-in company. Replace it with the real target project/company name.
placeholders:
  PROJECT_SLUG: "Repository and AWS resource slug, for example gcme-analytics-pilot"
  PILOT_NAME: "Human-readable pilot name"
  CUSTOMER_NAME: "Customer or internal stakeholder name, for example GCME - German Companies Make Everything"
  CUSTOMER_DOMAIN: "Customer email domain used for subscriber counts, for example gcme.example"
  GITHUB_OWNER: "GitHub org or user hosting the generated repository"
  PILOT_SCHEMA: "Exasol analytical schema name; domain-neutral, default PILOT_DW"
  COGNITO_DOMAIN_PREFIX: "Cognito Hosted-UI domain prefix; defaults to the project slug"
  LAMBDA_URL_ID: "Lambda Function URL id; runtime value, emitted by the deploy"
  COGNITO_USER_POOL_ID: "Cognito user pool ID; runtime value, supplied via environment at deploy time"
  SEMANTIC_LAYER_SCHEMA: "Optional third-party semantic-layer schema name"
  OPERATOR_USER: "Operator username; derived from OPERATOR_EMAIL local part"
  AWS_PROFILE: "Local AWS CLI profile"
  AWS_REGION: "AWS region"
  AWS_AZ: "AWS availability zone"
  PILOT_DOMAIN: "Optional public base domain"
  OPERATOR_EMAIL: "Primary operator email"
  OPS_ONLY_RECIPIENTS: "Comma-separated operational recipient list"
  BIZ_USER_RECIPIENTS: "Comma-separated business-user recipient list"
  AWS_TAGGING_POLICY: "Mandatory AWS tagging policy identifier; default exasol-it"
  ENVIRONMENT: "Exasol IT exa:Environment tag value"
  DEPARTMENT: "Exasol IT exa:Department tag value"
  COST_CENTER: "Exasol IT exa:CostCenter tag value"
  DATA_CLASSIFICATION: "Exasol IT exa:DataClassification tag value"
  DEFAULT_AWS_WORKLOAD: "Default Exasol IT exa:Workload tag value for application resources"
