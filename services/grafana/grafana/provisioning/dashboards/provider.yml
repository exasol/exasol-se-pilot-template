apiVersion: 1

providers:
  - name: '<CUSTOMER_NAME> Dashboards'
    orgId: 1
    folder: '<CUSTOMER_NAME> PILOT'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
